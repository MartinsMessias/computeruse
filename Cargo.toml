[package]
name = "computeruse"
version = "0.3.0"
edition = "2021"
authors = ["Messias Martins"]
description = "OS-Native Windows Computer-Use Engine, CLI & MCP Server (54 Tools) in Pure Rust: sub-millisecond Set-of-Marks UIA perception, atomic action pipelines, vector canvas engine & Per-Monitor DPI v2 input for AI Agents."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinsMessias/computeruse"
documentation = "https://docs.rs/computeruse"
repository = "https://github.com/MartinsMessias/computeruse"
keywords = ["mcp", "computer-use", "windows-automation", "ui-automation", "ai-agent"]
categories = ["os::windows-apis", "command-line-utilities", "development-tools"]

[lib]
name = "computeruse"
path = "src/lib.rs"

[[bin]]
name = "cu"
path = "src/bin/cu.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
uiautomation = "0.25.1"

[dev-dependencies]
tempfile = "3"
